<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Naitiri News Broadcast</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial;background:#020810;color:#fff;overflow:hidden}.b{width:100%;height:100%;background:radial-gradient(circle at 50% 15%,#173d59,#071522 50%,#02070c);position:relative}.top{height:12%;min-height:60px;background:#06111c;border-bottom:3px solid #20d46b;display:flex;align-items:center;justify-content:space-between;padding:0 3%}.brand{font-size:clamp(18px,3vw,42px);font-weight:900}.brand span{color:#20d46b}.live{background:#e51e3b;padding:7px 13px;border-radius:6px;font-weight:900}.main{height:45%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:2%;padding:2% 5%}.team{text-align:center}.logo{width:clamp(55px,7vw,110px);height:clamp(55px,7vw,110px);margin:auto auto 8px;border-radius:50%;background:#fff;color:#071522;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,3vw,38px);font-weight:900;border:3px solid #20d46b}.name{font-size:clamp(18px,3.2vw,52px);font-weight:900}.scorebox{text-align:center}.score{font-size:clamp(55px,9vw,135px);font-weight:900;line-height:.9}.period{font-size:clamp(13px,1.8vw,25px);font-weight:900;margin-top:10px}.timer{font-size:clamp(22px,3vw,43px);font-weight:900;color:#20d46b}.extra{color:#ffd84a;font-weight:900}.panels{height:38%;display:grid;grid-template-columns:1fr 1fr;gap:1.5%;padding:0 3% 5%}.p{background:rgba(3,13,23,.92);border:1px solid #29475c;border-radius:11px;padding:12px;overflow:auto}.p h3{margin:0 0 8px;color:#20d46b}.events,.stats{font-size:clamp(11px,1.35vw,18px);line-height:1.55}.footer{position:absolute;bottom:0;left:0;right:0;background:#050c14;border-top:1px solid #203447;text-align:center;padding:6px;color:#a8b7c5;font-size:12px}.ball{position:absolute;right:2%;top:14%;font-size:clamp(25px,4vw,52px);animation:s 5s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:700px){.main{padding:1% 2%;height:42%}.panels{grid-template-columns:1fr;height:42%;padding:0 2% 45px}.p:nth-child(2){display:none}}</style></head><body><div class='b'><div class='ball'>⚽</div><header class='top'><div class='brand'>NAITIRI <span>NEWS</span> LIVE</div><div class='live'>● LIVE</div></header><section class='main'><div class='team'><div id='la' class='logo'>A</div><div id='ta' class='name'>HOME TEAM</div></div><div class='scorebox'><div><span id='sa' class='score'>0</span><span class='score'> - </span><span id='sb' class='score'>0</span></div><div id='period' class='period'>1ST HALF</div><div id='timer' class='timer'>00:00</div><div id='extra' class='extra'></div></div><div class='team'><div id='lb' class='logo'>B</div><div id='tb' class='name'>AWAY TEAM</div></div></section><section class='panels'><div class='p'><h3>⚽ MATCH EVENTS</h3><div id='events' class='events'>No events yet.</div></div><div class='p'><h3>📊 MATCH STATISTICS</h3><div class='stats'>Possession: <b id='pa'>50</b>% — <b id='pb'>50</b>%<br>Shots: <b id='sha'>0</b> — <b id='shb'>0</b><br>Shots on target: <b id='toa'>0</b> — <b id='tob'>0</b><br>Corners: <b id='ca'>0</b> — <b id='cb'>0</b></div></div></section><div class='footer'>NAITIRI NEWS • LIVE FOOTBALL</div></div><script>const $=x=>document.getElementById(x);let state={home:0,away:0,seconds:0,teamA:'HOME TEAM',teamB:'AWAY TEAM',logoA:'A',logoB:'B',period:'1ST HALF',extra:'',events:[],pa:50,pb:50,sha:0,shb:0,toa:0,tob:0,ca:0,cb:0};let last='';function render(){state=JSON.parse(localStorage.getItem('naitiriState')||JSON.stringify(state));$('ta').textContent=state.teamA;$('tb').textContent=state.teamB;$('la').textContent=state.logoA;$('lb').textContent=state.logoB;$('sa').textContent=state.home;$('sb').textContent=state.away;$('period').textContent=state.period;$('extra').textContent=state.extra?'+'+state.extra+' added time':'';$('timer').textContent=fmt(state.seconds);$('events').innerHTML=state.events.length?state.events.map(e=>'<div>'+e+'</div>').join(''):'No events yet.';$('pa').textContent=state.pa;$('pb').textContent=state.pb;$('sha').textContent=state.sha;$('shb').textContent=state.shb;$('toa').textContent=state.toa;$('tob').textContent=state.tob;$('ca').textContent=state.ca;$('cb').textContent=state.cb}function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}render();setInterval(()=>{let x=localStorage.getItem('naitiriState');if(x&&x!==last){last=x;render()}},250);</script></body></html>
